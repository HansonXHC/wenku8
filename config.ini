[download]
threads = 8         ; 下载线程数
engine = auto       ; auto / curl_cffi / requests / cloudscraper
output_dir = txt    ; 相对脚本所在目录的输出文件夹
timeout = 120       ; 单请求超时(秒)
retries = 3         ; 下载失败重试次数
req_per_min = 40    ; 全局限速：每分钟请求数上限
request_delay = 0   ; 请求间附加延时(秒)，被限速时可调大
cookie =            ; 可选：被 Cloudflare 拦截时填浏览器解出的 cf_clearance 等 cookie
